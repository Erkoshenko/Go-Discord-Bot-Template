# ID тестового сервера: команды появятся мгновенно только на нём.
# Если пусто — команды регистрируются глобально (обновление может занять до часа).
test_guild_id: ""

moderation:
  log_channel: ""          # ID канала журнала модерации; пусто — журнал выключен
  warn_limit: 3            # столько действующих предупреждений ведут к автомуту; 0 — выключено
  warn_timeout_minutes: 60 # длительность автомута
